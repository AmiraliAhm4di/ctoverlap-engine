[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctoverlap"
version = "0.1.0"
description = "Clinical trial overlap engine"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "duckdb",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ctoverlap = "ctoverlap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]